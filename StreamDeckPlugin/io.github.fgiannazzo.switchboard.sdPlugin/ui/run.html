<!doctype html>
<html>
	<head lang="en">
		<meta charset="utf-8" />
		<title>Switchboard: Run</title>
		<!-- sdpi-components v4 is vendored next to this file so the inspector never loads anything from the network. -->
		<script src="sdpi-components.js"></script>
	</head>

	<body>
		<!--
			One control per setting: sdpi-components does not sync two controls bound to the same
			setting. label-setting keeps the chosen entry's text so it still shows while the app is down.
		-->
		<sdpi-item label="Run">
			<sdpi-select
				setting="id"
				label-setting="idLabel"
				datasource="getIds"
				hot-reload
				show-refresh
				placeholder="Pick a macro or action"
				loading="Asking Switchboard..."
			></sdpi-select>
		</sdpi-item>

		<sdpi-item label="Parameters">
			<sdpi-textarea setting="parameters" rows="3" placeholder='Optional JSON body, e.g. {"port": 2}'></sdpi-textarea>
		</sdpi-item>

		<div id="switchboard-connection"></div>
		<script src="connection.js"></script>
	</body>
</html>
